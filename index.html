<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#062b55">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Praxis Wetzel">
  <meta name="description" content="Patienten Self-Check-In – Hausarztzentrum Wetzel">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>Patienten Self-Check-In | Hausarztzentrum Wetzel</title>
  <style>
    .eyebrow {
      font-size: 1.42rem;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    .content-card h1 {
      font-size: 2.25rem;
    }

    /* Ein gemeinsamer Rahmen um Logo, Überschrift und gesamten Inhalt */
    .content-card {
      border: 2px solid #a9cbe9;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(6, 43, 85, 0.08);
      overflow: hidden;
    }

    /* Vorhandene Einzelrahmen innerhalb des neuen Gesamtrahmens entfernen */
    .content-card .brand,
    .content-card .announcement {
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background:
        radial-gradient(circle at 50% 52%, rgba(220, 239, 255, 0.72) 0%, rgba(237, 247, 255, 0.42) 34%, rgba(255, 255, 255, 0.05) 72%),
        linear-gradient(to bottom, rgba(235, 247, 255, 0.12) 0%, rgba(255, 255, 255, 0.32) 100%);
    }

    @media (max-width: 700px) {
      .content-card {
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="content-card">
      <header class="brand">
        <img src="assets/logo-header.jpg" alt="Hausarztzentrum Wetzel">
      </header>

      <section class="announcement">
      <div class="icon" aria-hidden="true">
        <span>i</span>
      </div>

      <p class="eyebrow">PATIENTEN-SELF-CHECK-IN</p>

      <h1>Demnächst für Sie verfügbar</h1>


      </section>
    </div>

    <footer>
      Hausarztzentrum Wetzel&nbsp;&nbsp;•&nbsp;&nbsp;Ihre Hausarztpraxis – mit Herz und Kompetenz
    </footer>
  </main>
</body>
</html>
